[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino

; Serial Monitor settings
monitor_speed = 115200

; Use LittleFS for internal flash CSV logging
board_build.filesystem = littlefs

; Enable C++ exceptions so try/throw/catch in readSensors() compiles
build_flags = 
    -fexceptions

; External library dependencies (Replaced LiquidCrystal_I2C with ST7789 & GFX)
lib_deps =
    adafruit/Adafruit SGP30 Sensor @ ^2.0.3
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4