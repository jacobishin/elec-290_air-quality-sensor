<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Quality Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; color: #1d2a2e; background: #f6f8f7; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  input, button { font: inherit; padding: 6px 10px; margin: 2px 0; }
  button { cursor: pointer; }
  nav { display: flex; gap: 8px; margin: 12px 0; }
  nav button.active { background: #1d2a2e; color: #fff; }
  .grade { display: inline-block; min-width: 2rem; text-align: center; padding: 2px 10px; border-radius: 4px; color: #fff; font-weight: 700; }
  .gases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .gas { background: #fff; border: 1px solid #cfd8d6; padding: 8px; }
  .gas b { display: block; font-size: 1.2rem; }
  .gas small { color: #52646a; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: .9rem; }
  th, td { border: 1px solid #cfd8d6; padding: 5px 8px; text-align: left; }
  td.summary {min-width: 180px; max-width: 280px; white-space: normal; }
  .scroll { overflow-x: auto; }
  #map { height: 380px; border: 1px solid #cfd8d6; margin: 8px 0; }
  #message { color: #b00020; }
</style>
</head>
<body>
<h1>Air Quality Monitor</h1>

<nav>
  <button id="tab-readings" class="active">My device</button>
  <button id="tab-map">Public map</button>
</nav>

<section id="view-readings">
<div id="login-section">
  <input id="device-id" placeholder="Device ID (e.g. monitor-01)">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <button id="login-btn">Log in</button>
  <button id="register-btn">Register this device</button>
  <p id="message"></p>
</div>

<div id="app" hidden>
  <p>Device: <b id="device-label"></b> <button id="logout-btn">Log out</button></p>
  <button id="add-test-btn">Add test reading</button>
  <div id="latest"></div>
  <h2>Recent readings</h2>
  <div class="scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
</div>
</section>

<section id="view-map" hidden>
  <p>Readings published by users. No login needed to view.</p>
  <div id="map"></div>
  <div id="publish-box" hidden>
    <p>To add yours: click the map to drop a pin, type the place name, then publish your latest reading.</p>
    <input id="place" placeholder="Place name (e.g. Stauffer Library)">
    <button id="publish-btn">Publish latest reading here</button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, query, orderByChild, limitToLast, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  //https://gas-monitor-6e3eb-default-rtdb.firebaseio.com
const firebaseConfig = {
  apiKey: "AIzaSyCInYadRTEuNcRaPqeYl7qe-p3b5zSzplI",
  authDomain: "gas-monitor-6e3eb.firebaseapp.com",
  // REPLACE with the exact URL shown at the top of Realtime Database -> Data in the Firebase console
  databaseURL: "https://gas-monitor-6e3eb-default-rtdb.firebaseio.com",
  projectId: "gas-monitor-6e3eb",
  storageBucket: "gas-monitor-6e3eb.firebasestorage.app",
  messagingSenderId: "1041203123160",
  appId: "1:1041203123160:web:6a371b01318ea9ad9998ad"
};

// Keys match the firmware's names (co, tvoc, eco2, temp, hum, pm25).
// "base" = clean-air baseline shown on the website (null = no baseline). Edit to the team's numbers.
const SENSORS = [
  { key: "co",   label: "Carbon monoxide",       unit: "ppm",   base: 5 },
  { key: "eco2", label: "Carbon dioxide (eCO2)", unit: "ppm",   base: 400 },
  { key: "tvoc", label: "TVOC",                  unit: "ppb",   base: 200 },
  { key: "pm25", label: "PM2.5",                 unit: "ug/m3", base: 8 },
  { key: "temp", label: "Temperature",           unit: "C",     base: null },
  { key: "hum",  label: "Humidity",              unit: "%",     base: null }
];
// Grade thresholds [first, danger], same idea as the firmware's THRESHOLD1 / THRESHOLD2.
// null = not decided yet. While none are set, the grade shows "?" (an active alert still shows E).
const THRESHOLDS = { co: [null, null], eco2: [null, null], tvoc: [null, null], pm25: [null, null] };
const GRADE_COLORS = { A: "#2e7d32", B: "#7cb342", C: "#f9a825", D: "#ef6c00", F: "#c62828" };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = (id) => document.getElementById(id);

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

// ---- reading a firmware-format reading: { timestamp_ms, alert_active, co: {avg, count, valid}, ... } ----
function valueOf(r, key) {
  const s = r[key];
  return (s && s.valid !== 0 && s.avg != null) ? Number(s.avg) : null;
}
function fmtTime(r) {
  const t = Number(r.timestamp_ms);               // the firmware currently sends seconds; ms also works
  return t ? new Date(t < 1e11 ? t * 1000 : t).toLocaleString() : "";
}
function gradeOf(r) {
  if (r.alert_active) return "E";
  let level = null;
  for (const [key, [t1, t2]] of Object.entries(THRESHOLDS)) {
    const v = valueOf(r, key);
    if (v === null) continue;
    if (t2 != null && v >= t2) return "E";
    if (t1 != null && v >= t1) level = "C";
    else if (level === null && (t1 != null || t2 != null)) level = "A";
  }
  return level || "?";
}
function gradeBadge(g) {
  const b = el("span", g, "grade");
  b.style.background = GRADE_COLORS[g] || "#777";
  return b;
}
function fmtTime(ts) { return ts ? ts.toDate().toLocaleString() : ""; }

const GRADE_WORDS = {A: "Amazing", B: "Good", C: "Okay", D: "Bad", F: "Very Bad"};
const HIGH_RATIO = 2;
function description(r){
  const ratios = GASES
          .map((g) => {
            const x = r.gases && r.gases[g.key];
            return x && x.baseline ? {key: g.key, ratio: x.value/x.baseline} : null;
          })
          .filter(Boolean);

  const high = ratios.filter((x) => x.ratio >= HIGH_RATIO)
          .sort((a, b) => b.ratio - a.ratio);
  const word = GRADE_WORDS[r.grade] || "Unknown";

  if (!ratios.length) return word;
  if (!high.length) return word + ": all gasses near baseline";
  return word + ": elevated " +
          high.map((x) => x.key + " (" + x.ratio.toFixed(1) + "x)").join(", ");
}
let deviceId = null, latest = null, unsub = null, registering = false;
let map = null, pin = null, markers = null;

// ---------- Login: the device ID is the username ----------
const idToEmail = (id) => id + "@monitor.example";

function readId() {
  const id = $("device-id").value.trim().toLowerCase();
  if (!/^[a-z0-9-]{3,30}$/.test(id)) {
    $("message").textContent = "Device ID must be 3-30 letters, numbers or hyphens.";
    return null;
  }
  return id;
}

$("login-btn").onclick = async () => {
  const id = readId(); if (!id) return;
  try { await signInWithEmailAndPassword(auth, idToEmail(id), $("password").value); }
  catch (e) { $("message").textContent = "Login failed: " + e.message; }
};

$("register-btn").onclick = async () => {
  const id = readId(); if (!id) return;
  registering = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, idToEmail(id), $("password").value);
    await set(ref(db, "deviceOwners/" + id), cred.user.uid);   // links this device ID to this account
    registering = false;
    showApp(cred.user);
  } catch (e) {
    registering = false;
    $("message").textContent = e.code === "auth/email-already-in-use"
      ? "That device ID is already registered. Log in instead." : e.message;
  }
};

$("logout-btn").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (registering) return;
  user ? showApp(user) : showLogin();
});

function showLogin() {
  if (unsub) { unsub(); unsub = null; }
  latest = null;
  $("login-section").hidden = false;
  $("app").hidden = true;
  $("publish-box").hidden = true;
}

function showApp(user) {
  deviceId = user.email.split("@")[0];
  $("device-label").textContent = deviceId;
  $("login-section").hidden = true;
  $("app").hidden = false;
  $("publish-box").hidden = false;
  $("message").textContent = "";
  if (unsub) unsub();
  // The ESP32 adds readings at devices/<id>/readings
  const q = query(ref(db, "devices/" + deviceId + "/readings"), orderByChild("timestamp_ms"), limitToLast(10));
  unsub = onValue(q, (snap) => {
    const rows = [];
    snap.forEach((child) => { rows.push(child.val()); });
    rows.reverse();                                   // newest first
    latest = rows[0] || null;
    renderLatest();
    renderTable(rows);
  }, (err) => alert("Could not read: " + err.message));
}

// ---------- Readings tab ----------
function renderLatest() {
  const box = $("latest");
  box.replaceChildren();
  if (!latest) { box.append(el("p", "No readings yet.")); return; }
  const head = el("p", "Latest reading, taken " + fmtTime(latest) + "  ");
  head.append(gradeBadge(gradeOf(latest)));
  if (latest.alert_active) head.append(" ALERT ACTIVE");
  box.append(head);
  const grid = el("div", undefined, "gases");
  SENSORS.forEach((s) => {
    const v = valueOf(latest, s.key);
    const card = el("div", undefined, "gas");
    card.append(el("span", s.label), el("b", v === null ? "no valid reading" : v + " " + s.unit));
    if (v !== null && s.base) card.append(el("small", "baseline " + s.base + " (" + (v / s.base).toFixed(1) + "x)"));
    grid.append(card);
  });
  box.append(grid);
}

function renderTable(rows) {
  const head = $("table-head"), body = $("table-body");
  head.replaceChildren(); body.replaceChildren();
  const hr = el("tr");
  ["Device time", "Grade", "Summary", ...GASES.map((g) => g.key + " (" + g.unit + ")")].forEach((t) => hr.append(el("th", t)));
  head.append(hr);
  rows.forEach((r) => {
    const tr = el("tr");
    tr.append(el("td", fmtTime(r.timestamp)), el("td", r.grade), el("td", description(r), "summary"));
    GASES.forEach((g) => tr.append(el("td", (r.gases && r.gases[g.key]) ? r.gases[g.key].value : "")));
    body.append(tr);
  });
}

// Fake reading in the same format the ESP32 sends.
$("add-test-btn").onclick = async () => {
  const r = { timestamp_ms: Math.floor(Date.now() / 1000), alert_active: 0 };
  SENSORS.forEach((s) => {
    r[s.key] = { avg: +((s.base || 20) * (0.5 + Math.random() * 3)).toFixed(2), count: 60, valid: 1 };
  });
  const grade = "ABCDF"[Math.floor(Math.random() * 5)];
  try {
    await addDoc(collection(db, "devices", deviceId, "readings"),
      { timestamp: Timestamp.fromDate(new Date()), grade, gases });
  } catch (e) { alert("Could not save: " + e.message); }
};

// ---------- Tabs ----------
function openTab(name) {
  $("view-readings").hidden = name !== "readings";
  $("view-map").hidden = name !== "map";
  $("tab-readings").classList.toggle("active", name === "readings");
  $("tab-map").classList.toggle("active", name === "map");
  if (name === "map") initMap();
}
$("tab-readings").onclick = () => openTab("readings");
$("tab-map").onclick = () => openTab("map");

// ---------- Map tab (public) ----------
function popupFor(r) {
  const d = el("div");
  d.append(el("b", r.place), el("br"), gradeBadge(gradeOf(r)), el("br"), el("small", fmtTime(r)));
  SENSORS.forEach((s) => {
    const v = valueOf(r, s.key);
    if (v !== null) d.append(el("br"), el("span", s.key + ": " + v + " " + s.unit));
  });
  return d;
}

function initMap() {
  if (map) { map.invalidateSize(); return; }
  map = L.map("map").setView([44.2253, -76.4951], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
  markers = L.layerGroup().addTo(map);
  map.on("click", (e) => {
    if (!auth.currentUser) return;
    if (pin) pin.setLatLng(e.latlng);
    else pin = L.circleMarker(e.latlng, { radius: 8, color: "#000", weight: 3, fill: false }).addTo(map);
  });
  const q = query(ref(db, "publicReadings"), orderByChild("timestamp_ms"), limitToLast(200));
  onValue(q, (snap) => {
    markers.clearLayers();
    snap.forEach((child) => {
      const r = child.val();
      L.circleMarker([r.lat, r.lng], { radius: 9, color: GRADE_COLORS[gradeOf(r)] || "#777", fillOpacity: 0.8 })
        .bindPopup(popupFor(r)).addTo(markers);
    });
  }, (err) => alert("Could not load map data: " + err.message));
}

$("publish-btn").onclick = async () => {
  const place = $("place").value.trim();
  if (!latest) return alert("You need a reading first.");
  if (!pin || !place) return alert("Click the map to drop a pin and type a place name.");
  const ll = pin.getLatLng();
  try {
    // The reading plus a place; no device ID or account info is copied.
    await push(ref(db, "publicReadings"), { ...latest, place, lat: ll.lat, lng: ll.lng });
    $("place").value = "";
  } catch (e) { alert("Could not publish: " + e.message); }
};
</script>
</body>
</html>
